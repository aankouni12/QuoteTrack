<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | QuoteTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card wide">
        <h1>Customer Requests</h1>

        <form method="GET" action="{{ url_for('dashboard') }}" class="filters">
            <input type="text" name="q" placeholder="Search name or email" value="{{ search }}">
            <select name="status">
                <option value="">All statuses</option>
                {% for s in statuses %}
                <option value="{{ s }}" {% if s == status %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
            <button type="submit">Filter</button>
        </form>

        {% if rows %}
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Service</th>
                        <th>Status</th>
                        <th>Submitted</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in rows %}
                    <tr>
                        <td>{{ row['name'] }}<br><small>{{ row['email'] }}</small></td>
                        <td>{{ row['service_type'] }}</td>
                        <td>{{ row['status'] }}</td>
                        <td>{{ row['created_at'][:10] }}</td>
                        <td><a href="{{ url_for('request_detail', request_id=row['id']) }}">View</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <p>No requests found.</p>
        {% endif %}
    </main>
</body>
</html>
