<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Service | QuoteTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card">
        <h1>Request a Service</h1>
        <p>Tell us what you need and we'll get back to you with an estimate.</p>

        {% if errors %}
        <ul class="errors">
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="POST" action="{{ url_for('request_form') }}">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required>

            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" name="phone" value="{{ form.get('phone', '') }}">

            <label for="service_type">Service</label>
            <select id="service_type" name="service_type" required>
                <option value="">Choose one</option>
                {% for service in services %}
                <option value="{{ service }}" {% if form.get('service_type') == service %}selected{% endif %}>{{ service }}</option>
                {% endfor %}
            </select>

            <label for="description">Describe the job</label>
            <textarea id="description" name="description" rows="5" required>{{ form.get('description', '') }}</textarea>

            <button type="submit">Submit Request</button>
        </form>
    </main>
</body>
</html>
